<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>English Coach</title>
<style>
:root{
  --bg:#f5f2ec; --card:#ffffff; --ink:#1d2a2f; --muted:#5d6c72; --line:#e3ded3;
  --accent:#0f766e; --accent-ink:#ffffff; --soft:#e2f1ef; --amber:#b45309; --amber-soft:#fdf0dc;
  --good:#166534; --good-soft:#dff3e4; --bad:#b91c1c; --bad-soft:#fbe4e4; --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11181b; --card:#192226; --ink:#e8eef0; --muted:#9db0b6; --line:#2a373c;
    --accent:#2dd4bf; --accent-ink:#06211e; --soft:#173532; --amber:#fbbf24; --amber-soft:#3a2e12;
    --good:#86efac; --good-soft:#143322; --bad:#fca5a5; --bad-soft:#3b1a1a; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:84px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.4em 0 .8em}
button{font:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.brand{font-weight:800;letter-spacing:.2px;color:var(--accent)}
.chips{display:flex;gap:8px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.main{padding:8px 16px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.card.accent{background:var(--soft);border-color:transparent}
.muted{color:var(--muted)} .small{font-size:.9rem}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 16px;font-weight:700;text-align:center;margin:8px 0}
.btn.secondary{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;margin:4px 6px 4px 0;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:0;color:var(--muted);font-size:1.2rem;padding:6px 10px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav .in{display:flex;max-width:640px;width:100%}
.nav button{flex:1;background:transparent;border:0;color:var(--muted);padding:6px 2px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span.i{font-size:1.25rem}
.nav button.on{color:var(--accent);font-weight:700}
.stage{margin:18px 0 6px;font-weight:700;color:var(--muted);text-transform:uppercase;font-size:.8rem;letter-spacing:.06em}
.unit{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;width:100%;text-align:left;color:inherit}
.unit .num{min-width:42px;font-weight:800;color:var(--accent)}
.unit.locked{opacity:.55} .unit.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.badge{font-size:.75rem;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--accent);white-space:nowrap}
.badge.done{background:var(--good-soft);color:var(--good)} .badge.soon{background:var(--line);color:var(--muted)}
.step{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;width:100%;text-align:left;color:inherit}
.step .ic{font-size:1.4rem}
.step.done{border-color:var(--good)} .step.off{opacity:.5}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.meter i{display:block;height:100%;background:var(--accent)}
.qhead{display:flex;align-items:center;gap:10px;padding:12px 12px 4px}
.count{font-size:.85rem;color:var(--muted);min-width:42px;text-align:right}
.qwrap{padding:8px 16px}
.prompt{font-size:1.2rem;font-weight:600;margin:10px 0 14px}
.prompt.fill{font-weight:500;line-height:2}
.hint{color:var(--muted);font-size:.95rem}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-size:1.05rem;color:inherit}
.opt.good{border-color:var(--good);background:var(--good-soft)} .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
input.fillin,input.typedin,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input.fillin{display:inline-block;width:9em;margin:0 6px;text-align:center}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:160px;resize:vertical}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:14px;margin:8px 0 14px}
.tile{background:var(--soft);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:8px 12px;font-size:1.05rem}
.say{font-size:1.5rem;font-weight:700;margin:6px 0 10px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:2rem;display:block;margin:14px auto}
.mic.on{background:var(--bad);color:#fff}
.fb{margin:14px 0;padding:12px 14px;border-radius:14px}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .exp{color:var(--ink);margin-top:6px;font-size:.95rem}
.nudge{color:var(--amber);min-height:1.2em;font-size:.95rem}
.actions{padding:0 16px}
.locked .opt,.locked input,.locked .tile{pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .opt{padding:12px;font-size:1rem}
.pair .opt.sel{border-color:var(--accent);background:var(--soft)}
.pair .opt.gone{visibility:hidden}
.big{font-size:3rem;font-weight:800;text-align:center;margin:8px 0}
.note{background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.92rem;margin:10px 0}
.gram h3{margin-top:1em} .gram ul{padding-left:1.2em} .gram li{margin:.3em 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d2a2f;color:#fff;padding:10px 16px;border-radius:999px;font-size:.92rem;z-index:20;max-width:90%}
.flash{font-size:1.8rem;font-weight:800;text-align:center;margin:12px 0}
pre.snap{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font:.85rem/1.45 ui-monospace,Menlo,Consolas,monospace}
table.t{width:100%;border-collapse:collapse;font-size:.92rem} table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
label.fld{display:block;margin:10px 0 4px;font-weight:600}
select{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.check input{width:22px;height:22px;margin-top:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script src="js/content.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
